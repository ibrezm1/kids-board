<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teaching Whiteboard</title>
  <meta name="description" content="A simple, fast, browser-based drawing board for teaching and presentations. Freehand pen, quick colors, undo, clear all, and PNG upload/download.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Drawing Canvas -->
  <div id="canvas-container">
    <canvas id="whiteboard"></canvas>
    
    <!-- Drag & Drop Overlay Indicator -->
    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-badge">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span>Drop PNG or image here to open on whiteboard</span>
      </div>
    </div>
  </div>

  <!-- Primary Floating Toolbar -->
  <header id="toolbar" role="toolbar" aria-label="Drawing tools">
    
    <!-- 1. Tools: Pen & Eraser -->
    <div class="toolbar-group" aria-label="Tool mode">
      <button id="tool-pen" class="btn btn-tool active" title="Pen (Shortcut: P)" aria-label="Pen tool">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
          <path d="M2 2l7.586 7.586"></path>
        </svg>
        <span class="btn-label">Pen</span>
      </button>

      <button id="tool-eraser" class="btn btn-tool" title="Eraser (Shortcut: E)" aria-label="Eraser tool">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20H7L3 16C2 15 2 13 3 12L13 2C14 1 16 1 17 2L22 7C23 8 23 10 22 11L13 20"></path>
          <path d="M18 12L7 12"></path>
        </svg>
        <span class="btn-label">Eraser</span>
      </button>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <!-- 2. Brush Sizes: Thin, Medium, Thick -->
    <div class="toolbar-group" aria-label="Brush size">
      <button class="btn btn-size" data-size="thin" title="Thin line" aria-label="Thin line size">
        <span class="size-indicator size-thin"></span>
        <span class="btn-label">Thin</span>
      </button>
      <button class="btn btn-size active" data-size="medium" title="Medium line" aria-label="Medium line size">
        <span class="size-indicator size-medium"></span>
        <span class="btn-label">Medium</span>
      </button>
      <button class="btn btn-size" data-size="thick" title="Thick line" aria-label="Thick line size">
        <span class="size-indicator size-thick"></span>
        <span class="btn-label">Thick</span>
      </button>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <!-- 3. Quick Color Selection (One-click) -->
    <div class="toolbar-group colors-group" aria-label="Color selection">
      <button class="color-btn active" data-color="#111827" title="Black (Shortcut: 1)" aria-label="Black color" style="--c: #111827;">
        <span class="swatch"></span>
      </button>
      <button class="color-btn" data-color="#dc2626" title="Red (Shortcut: 2)" aria-label="Red color" style="--c: #dc2626;">
        <span class="swatch"></span>
      </button>
      <button class="color-btn" data-color="#2563eb" title="Blue (Shortcut: 3)" aria-label="Blue color" style="--c: #2563eb;">
        <span class="swatch"></span>
      </button>
      <button class="color-btn" data-color="#16a34a" title="Green (Shortcut: 4)" aria-label="Green color" style="--c: #16a34a;">
        <span class="swatch"></span>
      </button>
      <button class="color-btn" data-color="#ea580c" title="Orange (Shortcut: 5)" aria-label="Orange color" style="--c: #ea580c;">
        <span class="swatch"></span>
      </button>
      <button class="color-btn" data-color="#9333ea" title="Purple (Shortcut: 6)" aria-label="Purple color" style="--c: #9333ea;">
        <span class="swatch"></span>
      </button>

      <!-- Custom Color Picker -->
      <label class="color-picker-label" title="Custom color picker">
        <input type="color" id="custom-color" value="#111827" aria-label="Custom color picker">
        <span class="custom-color-icon" aria-hidden="true">🎨</span>
      </label>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <!-- 4. Erase Last (Undo) & Erase All (Clear) -->
    <div class="toolbar-group" aria-label="History actions">
      <button id="btn-undo" class="btn btn-action" title="Undo last action (Ctrl+Z)" aria-label="Undo last action">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"></path>
          <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
        </svg>
        <span class="btn-label">Undo</span>
      </button>

      <button id="btn-clear" class="btn btn-danger" title="Clear entire whiteboard" aria-label="Clear whiteboard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
        <span class="btn-label">Clear</span>
      </button>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <!-- 5. Upload PNG, Download PNG, Fullscreen -->
    <div class="toolbar-group" aria-label="Board file and view options">
      <!-- Hidden file input for uploading PNG / images -->
      <input type="file" id="image-upload-input" accept="image/png, image/jpeg, image/webp" class="visually-hidden">
      
      <button id="btn-upload" class="btn btn-action" title="Upload PNG or image to board (Ctrl+O)" aria-label="Upload image to board">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span class="btn-label">Upload</span>
      </button>

      <button id="btn-download" class="btn btn-action" title="Download whiteboard as PNG (Ctrl+S)" aria-label="Download whiteboard as PNG">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="btn-label">Save</span>
      </button>

      <button id="btn-fullscreen" class="btn btn-icon" title="Toggle Fullscreen (F)" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>

  </header>

  <!-- Confirmation Modal for "Clear All" -->
  <div id="clear-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="clear-modal-title">
    <div class="modal-card">
      <div class="modal-body">
        <div class="modal-icon-warning">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div class="modal-content">
          <h2 id="clear-modal-title">Clear entire board?</h2>
          <p>This will erase all current drawings and images. Are you sure you want to start fresh?</p>
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="btn-modal-confirm" class="btn btn-danger-solid">Yes, Clear All</button>
      </div>
    </div>
  </div>

  <!-- Toast notification with quick recovery option -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite">
    <span id="toast-text">Whiteboard cleared</span>
    <button id="toast-undo" class="toast-btn">Undo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
